name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check
        run: python -c "import app; print(app.app.title)"

      - name: API integration tests
        run: python -m unittest tests.test_api -v

      - name: Django tests
        run: python manage.py test core.tests

  e2e:
    name: Playwright + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          npm ci
          pip install -r requirements.txt
          npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
        env:
          LUMINA_ENV: development
          JWT_SECRET: ci-test-secret
          SEED_DEMO_USER: "0"
          ENABLE_DOCS: "0"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [frontend, backend, e2e]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lumina-notes:${{ github.sha }} .
