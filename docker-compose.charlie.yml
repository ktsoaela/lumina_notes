# charlie = local development
# Usage: docker compose -p charlie -f docker-compose.yml -f docker-compose.charlie.yml up --build

name: charlie

services:
  db:
    ports:
      - "5433:5432"
    volumes:
      - charlie_pg:/var/lib/postgresql/data

  api:
    ports:
      - "58881:58888"
    environment:
      LUMINA_ENV: development
      JWT_SECRET: charlie-dev-only-secret
      CORS_ORIGINS: http://127.0.0.1:5173,http://127.0.0.1:58881,http://localhost:5173
      SEED_DEMO_USER: "1"
      ENABLE_DOCS: "1"
      AUTH_RATE_LIMIT: "100"
    env_file:
      - path: .env.charlie
        required: false

volumes:
  charlie_pg:
  pgdata:
