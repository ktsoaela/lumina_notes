# Shared base — extend with charlie / bravo / alpha overlays.
# Desktop/Electron stays on SQLite; these stacks use Postgres.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina}
      POSTGRES_DB: lumina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lumina:${POSTGRES_PASSWORD:-lumina}@db:5432/lumina
    restart: unless-stopped

volumes:
  pgdata:
