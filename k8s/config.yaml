apiVersion: v1
kind: Secret
metadata:
  name: lumina-notes-secrets
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
type: Opaque
stringData:
  # REQUIRED: replace with a long random secret before any shared/prod cluster
  JWT_SECRET: REPLACE_WITH_STRONG_SECRET
  # Optional Django admin (if running manage.py against the same DB)
  DJANGO_SECRET_KEY: REPLACE_WITH_STRONG_DJANGO_SECRET
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumina-notes-config
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
data:
  PORT: "58888"
  LUMINA_ENV: production
  SEED_DEMO_USER: "0"
  ENABLE_DOCS: "0"
  JWT_EXPIRE_HOURS: "24"
  # Explicit origins only — never use "*" with cookie/credentialed clients
  CORS_ORIGINS: "https://lumina-notes.local"
