apiVersion: v1
kind: Secret
metadata:
  name: lumina-notes-secrets
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_STRONG_SECRET
  DJANGO_SECRET_KEY: REPLACE_WITH_STRONG_DJANGO_SECRET
  # Required in production (server): Postgres DSN
  DATABASE_URL: postgresql://lumina:REPLACE_DB_PASSWORD@lumina-notes-postgres:5432/lumina
  POSTGRES_PASSWORD: REPLACE_DB_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumina-notes-config
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
data:
  PORT: "58888"
  LUMINA_ENV: production
  SEED_DEMO_USER: "0"
  ENABLE_DOCS: "0"
  JWT_EXPIRE_HOURS: "24"
  CORS_ORIGINS: "https://lumina-notes.local"
  POSTGRES_USER: lumina
  POSTGRES_DB: lumina
