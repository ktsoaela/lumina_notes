apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lumina-notes-postgres
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
    app.kubernetes.io/component: postgres
spec:
  serviceName: lumina-notes-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lumina-notes
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumina-notes
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: lumina-notes-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: lumina-notes-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumina-notes-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lumina"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lumina-notes-postgres
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: lumina-notes
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
