apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lumina-notes-data
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lumina-notes
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lumina-notes
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumina-notes
  namespace: lumina-notes
  labels:
    app.kubernetes.io/name: lumina-notes
  annotations:
    # Adjust for your ingress controller (nginx example)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: lumina-notes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lumina-notes
                port:
                  name: http
